services:
  - type: web
    name: spi-pp-produtividade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_KEY
        sync: false
      - key: VIEW_KEY
        sync: false
